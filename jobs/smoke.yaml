# Smoke da Etapa 1: 45 prompts por modelo, passando por todos os comprimentos
# (inclusive 261120) e pelas quatro tarefas. Mede o desempenho e estima o tempo
# da execução completa (seção 5 do REPORT.md).
# Envie da raiz do repositório:  sauron submit -c jobs/smoke.yaml jobs/smoke.sh
name: lumi-ctx-smoke
image: vllm/vllm-openai:v0.29.0
gpus: 1
vram: 160            # acima de 89 GB: só cabe na classe de ~179 GB (B200)
cpus: 4              # construção dos prompts + 1 processo vLLM
memory: 32g          # pico esperado bem abaixo disso; confira "ram pico" no sauron status
max_time: 1h

# subpasta de ~/workspace com o clone; o job já começa dentro dela
workspace: lumi-inference
